<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Horários por Turma')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h2>Horários por Turma</h2>

    <form method="get" th:action="@{/horarios/por-turma}" class="row g-2 bg-white p-3 rounded mb-4">
        <div class="col-md-8">
            <select name="turmaId" class="form-select">
                <option value="">Selecione uma turma...</option>
                <option th:each="t : ${turmas}"
                        th:value="${t.id}"
                        th:text="${t.nome}"
                        th:selected="${turmaSelecionada != null and turmaSelecionada.id == t.id}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-dark w-100">Consultar</button>
        </div>
    </form>

    <div th:if="${turmaSelecionada != null}">
        <h4 th:text="'Turma: ' + ${turmaSelecionada.nome}"></h4>
        <table class="table table-striped bg-white">
            <thead>
            <tr>
                <th>Professor</th>
                <th>Disciplina</th>
                <th>Dia</th>
                <th>Início</th>
                <th>Fim</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="horario : ${horarios}">
                <td th:text="${horario.professor.nome}"></td>
                <td th:text="${horario.disciplina.nome}"></td>
                <td th:text="${horario.diaSemana.descricao}"></td>
                <td th:text="${horario.horaInicio}"></td>
                <td th:text="${horario.horaFim}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(horarios)}">
                <td colspan="5" class="text-center text-muted">Esta turma não possui horários cadastrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
