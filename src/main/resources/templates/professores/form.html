<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Professor')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h2 th:text="${professor.id} == null ? 'Novo Professor' : 'Editar Professor'"></h2>

    <form th:action="@{/professores/salvar}" th:object="${professor}" method="post" class="bg-white p-4 rounded">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" th:field="*{telefone}" class="form-control">
        </div>

        <button type="submit" class="btn btn-dark">Salvar</button>
        <a th:href="@{/professores}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
